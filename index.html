<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101318" />
  <title>Acervo MTG — Scanner v0.1</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">ACERVO MTG</p>
        <h1>Scanner v0.1</h1>
      </div>
      <div class="counter">
        <span id="count">0</span>
        <small>capturas</small>
      </div>
    </header>

    <section class="camera-shell" id="cameraShell">
      <video id="video" playsinline muted></video>

      <div class="shade"></div>
      <div class="card-frame" id="cardFrame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div class="frame-label">ALINHE A CARTA</div>
      </div>

      <div class="status-pill" id="status">Câmera desligada</div>
    </section>

    <section class="controls">
      <button id="startBtn" class="primary">Iniciar câmera</button>
      <button id="manualBtn" class="secondary" disabled>Capturar agora</button>
      <label class="toggle">
        <input id="autoToggle" type="checkbox" checked />
        <span>Captura automática</span>
      </label>
    </section>

    <section class="last-capture">
      <div class="section-title">
        <h2>Última captura</h2>
        <span id="quality">—</span>
      </div>
      <div class="preview-empty" id="previewEmpty">
        A imagem recortada da carta aparecerá aqui.
      </div>
      <img id="preview" alt="Última carta capturada" hidden />
    </section>

    <details class="tuning">
      <summary>Ajustes de teste</summary>
      <label>
        Estabilidade
        <input id="stableThreshold" type="range" min="1" max="20" value="6" />
        <output id="stableValue">6</output>
      </label>
      <label>
        Movimento para liberar próxima carta
        <input id="changeThreshold" type="range" min="5" max="40" value="18" />
        <output id="changeValue">18</output>
      </label>
    </details>

    <canvas id="sampleCanvas" width="48" height="67" hidden></canvas>
    <canvas id="captureCanvas" width="630" height="880" hidden></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
